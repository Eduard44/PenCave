<!DOCTYPE html>
<!-- index.html: the one page of the site. Later, a small script will fill
     it with whichever lesson page is open. For now it shows the top bar
     and a temporary test area. -->
<html lang="en"> <!-- lang tells screen readers which language to speak -->
<head>
  <meta charset="utf-8"> <!-- lets the page show any letter correctly -->
  <!-- Makes the page fit a phone screen instead of shrinking a desktop layout. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PenCave</title>

  <!-- Stylesheets. Order matters: tokens first, because the others use them. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/drawn.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/bar.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/beats.css">
  <link rel="stylesheet" href="css/contents.css">
  <link rel="stylesheet" href="css/collect.css">
  <link rel="stylesheet" href="css/journal.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/progress.css"> <!-- Your progress: two columns, levels, records, save file -->
  <link rel="stylesheet" href="css/timer.css"> <!-- the Timer: chip in the bar, Timer page, sound box -->
  <link rel="stylesheet" href="css/text-pages.css"> <!-- About, Privacy, the Erase box -->
</head>
<body>
  <!-- "paper" = the grey paper and grain. "screen" = the box the phone layout measures. -->
  <div class="paper screen has-ribbon" id="screen"> <!-- has-ribbon: the bar leaves room for the bookmark ribbon -->

    <!-- THE TOP BAR. Same on every page. href="#" links go nowhere yet:
         the Contents and Your progress pages come in later steps. -->
    <header class="bar">
      <!-- The name is the only menu: it opens the Contents page, on desktop and phone alike. -->
      <a class="brand" href="#contents" aria-label="PenCave, open the contents">PenCave</a>

      <!-- Empty on purpose: the timer chip appears at Level 2 (a later step). -->
      <div class="bar-mid"></div>

      <!-- aria-label is what a screen reader says, since the words may be hidden on a phone. -->
      <a class="bar-right" href="#progress" aria-label="Level 1, 0 points. Opens Your progress">
        <span class="avatar" data-drawn="ring" data-seed="avatar"><span class="avatar-n">1</span></span>
        <span class="level-text">Level 1 · 0 pts</span>
      </a>

      <!-- The pencil line under the bar. Drawn by draw.js. -->
      <span class="rule-under" data-drawn="rule" data-seed="bar-under"></span>
    </header>

    <!-- The bookmark ribbon: fills from the top as you move through the lesson. book.js sets its fill. -->
    <span class="ribbon" id="ribbon" data-drawn="ribbon" data-seed="ribbon" data-value="0" aria-hidden="true"></span>

    <!-- The page. book.js fills this from the lesson data. aria-live="polite":
         a screen reader announces the new page after a turn. -->
    <main class="page" id="page-content" aria-live="polite"></main>

    <!-- The footer: Previous, page count, Next. Links are set by book.js. -->
    <nav class="page-foot" id="page-foot" aria-label="Turn the page">
      <span class="rule-over" data-drawn="rule" data-seed="foot-rule"></span>
      <a class="pf-link" id="prev" href="#"><i class="icon" data-icon="arrow-left"></i><span>Previous</span></a>
      <div class="pf-count" id="count">Page <div class="note hide-phone">arrow keys also turn the page</div></div>
      <a class="pf-link" id="next" href="#"><span>Next</span><i class="icon" data-icon="arrow-right"></i></a>
    </nav>

    <!-- THE SITE FOOTER: the same on every page (book pages, Contents, tools, Your progress, About, Privacy),
         and on every page we add later, because it lives here and not inside a page. -->
    <footer class="site-foot" id="site-foot">
      <span class="rule-over" data-drawn="rule" data-seed="site-foot-rule"></span>
      <a href="#about">About</a>
      <span aria-hidden="true">·</span>
      <a href="#privacy">Privacy</a>
    </footer>
  </div>

  <!-- THE COLLECT BOX. A built-in <dialog>: hidden until collect.js opens it.
       The pencil border and paper fill sit on the inner div (the dialog itself
       must stay free to be centred by the browser). collect.js fills the inside. -->
  <dialog class="collect-box" id="collect" aria-label="Collect your points">
    <div id="collect-body" data-drawn="box" data-fill="paper" data-seed="collect-box"></div>
  </dialog>

  <!-- Scripts go last, so the page exists before they run. -->
  <script src="js/draw.js"></script>
  <script src="js/art.js"></script>
  <script src="js/beats.js"></script> <!-- the page types: Guided try, Your turn, Reflect -->

  <script src="js/progress.js"></script> <!-- saved progress, points and levels -->
  <script src="js/contents.js"></script> <!-- the Contents page -->
  <script src="js/collect.js"></script> <!-- the Collect box -->
  <script src="js/journal.js"></script> <!-- the practice journal: add a note, edit, delete -->
  <script src="js/calendar.js"></script> <!-- the year strip and the month view -->
  <script src="js/save-file.js"></script> <!-- Download my save and Load a save -->
  <script src="js/progress-page.js"></script> <!-- the Your progress page -->
  <script src="js/timer.js"></script> <!-- the Timer clock and the chip in the top bar -->
  <script src="js/sounds.js"></script> <!-- the end sounds and the sound box -->
  <script src="js/timer-page.js"></script> <!-- the Timer page -->
  <script src="js/text-data.js"></script> <!-- the words of About and Privacy (you edit this one) -->
  <script src="js/text-pages.js"></script> <!-- the About and Privacy pages and the Erase box -->
  <!-- Lesson data: one file per lesson. Lessons 2 to 6 are placeholders for now. -->
  <script src="lessons/lesson-1.js"></script>
  <script src="lessons/lesson-2.js"></script>
  <script src="lessons/lesson-3.js"></script>
  <script src="lessons/lesson-4.js"></script>
  <script src="lessons/lesson-5.js"></script>
  <script src="lessons/lesson-6.js"></script>
  <!-- book.js goes last: it needs everything above. -->
  <script src="js/book.js"></script>
</body>
</html>
